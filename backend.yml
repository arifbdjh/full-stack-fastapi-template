apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: fastapi-lab
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fastapi-backend
  template:
    metadata:
      labels:
        app: fastapi-backend
    spec:
      containers:
        - name: backend
          image: arifbdjh/fastapi-backend:v1
          imagePullPolicy: IfNotPresent
          command: ["fastapi", "run", "--workers", "1"]
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - secretRef:
                name: fastapi-app
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fastapi-db
                  key: POSTGRES_PASSWORD
            - name: DATABASE_URL
              value: "postgresql://postgres:$(POSTGRES_PASSWORD)@db:5432/app"
            - name: PROJECT_NAME
              value: "FastAPI Lab"
          readinessProbe:
            httpGet:
              path: /api/v1/utils/health-check/
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: fastapi-lab
spec:
  type: NodePort
  selector:
    app: fastapi-backend
  ports:
    - name: http
      port: 8000
      targetPort: http
      nodePort: 32080
