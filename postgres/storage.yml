apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: fastapi-local
provisioner: kubernetes.io/no-provisioner
volumeBindingMode: WaitForFirstConsumer
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: fastapi-postgres-pv
spec:
  capacity:
    storage: 2Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: fastapi-local
  local:
    path: /mnt/data/fastapi-postgres
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - host2
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: fastapi-postgres-pvc
  namespace: fastapi-lab
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: fastapi-local
  resources:
    requests:
      storage: 2Gi
